<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vance Larsen's Music</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: url('https://images.unsplash.com/photo-1523995462485-3d171b3b9f14?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            margin: 5% auto;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .song {
            background: #8B4513;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .song a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
        }

        .song a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vance's Music</h1>
        <p>Free downloads for my original country songs — more to come!</p>

        <div class="song">
            <p> <strong> I Hope You Know</strong></p>
            <a href="Hope You Know.mp3" download>Download</a>
        </div>

        <footer>
            © 2025 Vance's Country Music.
        </footer>
    </div>
</body>
</html>
